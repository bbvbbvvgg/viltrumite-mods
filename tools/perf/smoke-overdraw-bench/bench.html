<!doctype html><html><body><canvas id=c width=1280 height=720></canvas><script>
// Overdraw A/B: Viltrumite soft smoke drawn as full quads vs trimmed to the visible sprite rectangle.
// Same shader as soft_particle.fsh (discard alpha < 0.004, SRC_ALPHA/ONE_MINUS_SRC_ALPHA, no depth write).
window.run = async function(sprites, opts) {
  const cv=document.getElementById('c'); cv.width=opts.w; cv.height=opts.h;
  const gl=cv.getContext('webgl2',{antialias:false,preserveDrawingBuffer:true,alpha:false});
  // atlas: 8 x 64px in a 512x64 strip (+ padding row of zero pixels around is irrelevant: inset 1%)
  const atlas=document.createElement('canvas'); atlas.width=512; atlas.height=64; const ac=atlas.getContext('2d');
  const imgs=await Promise.all(sprites.map(s=>new Promise(r=>{const i=new Image(); i.onload=()=>r(i); i.src=s;})));
  imgs.forEach((im,k)=>ac.drawImage(im,k*64,0));
  const px=ac.getImageData(0,0,512,64).data;
  // visible rect per sprite (alpha>0), padded 1 texel, in image fractions -> quad fractions with 1% inset
  const trims=[]; for(let k=0;k<8;k++){let x0=99,x1=-1,y0=99,y1=-1;for(let y=0;y<64;y++)for(let x=0;x<64;x++){if(px[((y*512)+k*64+x)*4+3]>0){x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y);}}
    const f=[Math.max(0,x0-1)/64,Math.min(64,x1+2)/64,Math.max(0,y0-1)/64,Math.min(64,y1+2)/64].map(v=>Math.min(1,Math.max(0,(v-0.01)/0.98)));trims.push(f);}
  const tex=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,tex);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL,false);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,new ImageData(new Uint8ClampedArray(px),512,64));
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  const vs=`#version 300 es
  in vec3 p; in vec2 uv; in vec4 col; uniform mat4 P; out vec2 t; out vec4 c; void main(){gl_Position=P*vec4(p,1.0);t=uv;c=col;}`;
  const fs=`#version 300 es
  precision highp float; uniform sampler2D s; in vec2 t; in vec4 c; out vec4 o;
  void main(){ vec4 k=texture(s,t)*c; if(k.a<0.004) discard; o=k; }`;
  function sh(t,src){const s=gl.createShader(t);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(s);return s;}
  const pr=gl.createProgram(); gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs)); gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs)); gl.linkProgram(pr); gl.useProgram(pr);
  const f=1/Math.tan(opts.fov*Math.PI/360), a=opts.w/opts.h, n=0.05, fa=512;
  gl.uniformMatrix4fv(gl.getUniformLocation(pr,'P'),false,new Float32Array([f/a,0,0,0, 0,f,0,0, 0,0,(fa+n)/(n-fa),-1, 0,0,2*fa*n/(n-fa),0]));
  // deterministic puffs: a ruin seen from opts.dist blocks, view space (camera at origin looking -z)
  let seed=12345; const rnd=()=>{seed=(seed*1103515245+12345)&0x7fffffff; return seed/0x7fffffff;};
  const puffs=[]; for(let i=0;i<opts.count;i++){ const z=-(opts.dist+ (rnd()-0.5)*opts.depth); puffs.push({x:(rnd()-0.5)*opts.spread, y:(rnd()-0.3)*opts.spread*0.6, z,
     size:opts.minSize+rnd()*(opts.maxSize-opts.minSize), roll:rnd()*6.283, spr:Math.floor(rnd()*8), g:0.15+rnd()*0.35, al:0.12+rnd()*0.38}); }
  puffs.sort((p,q)=>p.z-q.z); // back to front, fixed order for both modes
  function build(trim){ const v=[]; for(const p of puffs){ const tr=trim?trims[p.spr]:[0,1,0,1];
      const s0=tr[0],s1=tr[1],t0=tr[2],t1=tr[3]; const xn=1-2*s1,xf=1-2*s0,yn=1-2*t1,yf=1-2*t0;
      const uA=(p.spr*64+0.01*64)/512,uB=(p.spr*64+0.99*64)/512,vA=0.01,vB=0.99;
      const L=(t,a,b)=>a+t*(b-a); const uS0=L(s0,uA,uB),uS1=L(s1,uA,uB),vT0=L(t0,vA,vB),vT1=L(t1,vA,vB);
      const cs=Math.cos(p.roll),sn=Math.sin(p.roll);
      const C=(cx,cy,u,vv)=>{const rx=(cx*cs-cy*sn)*p.size,ry=(cx*sn+cy*cs)*p.size; return [p.x+rx,p.y+ry,p.z,u,vv,p.g,p.g,p.g*0.97,p.al];};
      const q=[C(xn,yn,uS1,vT1),C(xn,yf,uS1,vT0),C(xf,yf,uS0,vT0),C(xf,yn,uS0,vT1)];
      for(const i of [0,1,2,0,2,3]) v.push(...q[i]); }
    return new Float32Array(v); }
  const bufs={full:build(false),trim:build(true)};
  const vb=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,vb);
  const loc=n=>gl.getAttribLocation(pr,n); const st=9*4;
  gl.enableVertexAttribArray(loc('p')); gl.vertexAttribPointer(loc('p'),3,gl.FLOAT,false,st,0);
  gl.enableVertexAttribArray(loc('uv')); gl.vertexAttribPointer(loc('uv'),2,gl.FLOAT,false,st,12);
  gl.enableVertexAttribArray(loc('col')); gl.vertexAttribPointer(loc('col'),4,gl.FLOAT,false,st,20);
  gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA); gl.disable(gl.DEPTH_TEST);
  function frame(mode){ gl.bufferData(gl.ARRAY_BUFFER,bufs[mode],gl.STREAM_DRAW); gl.clearColor(0.55,0.62,0.7,1); gl.clear(gl.COLOR_BUFFER_BIT); gl.drawArrays(gl.TRIANGLES,0,bufs[mode].length/9); }
  function pixels(){ const b=new Uint8Array(opts.w*opts.h*4); gl.readPixels(0,0,opts.w,opts.h,gl.RGBA,gl.UNSIGNED_BYTE,b); return b; }
  const res={renderer:gl.getParameter(gl.RENDERER), count:opts.count};
  // coverage: screen area of all quads / screen area (overdraw factor) for each mode
  function cover(mode){ const d=bufs[mode]; let A=0; for(let i=0;i<d.length;i+=54){ const pts=[0,9,18,36].map(o=>{const x=d[i+o],y=d[i+o+1],z=d[i+o+2]; return [f/a*x/-z,f*y/-z];}); let s=0; for(let k=0;k<4;k++){const p=pts[k],q=pts[(k+1)%4]; s+=p[0]*q[1]-q[0]*p[1];} A+=Math.abs(s)/2; } return A/4; }
  res.overdraw_full=cover('full'); res.overdraw_trim=cover('trim');
  frame('full'); const A=pixels(); frame('trim'); const B=pixels();
  let diff=0,maxd=0; for(let i=0;i<A.length;i++){const d=Math.abs(A[i]-B[i]); if(d){diff++; maxd=Math.max(maxd,d);}}
  res.diff_channels=diff; res.max_diff=maxd;
  for(const mode of ['full','trim','full','trim']){ frame(mode); gl.finish(); const t0=performance.now(); for(let k=0;k<opts.frames;k++){frame(mode);} gl.readPixels(0,0,1,1,gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array(4)); const ms=(performance.now()-t0)/opts.frames; (res['ms_'+mode]=res['ms_'+mode]||[]).push(+ms.toFixed(2)); }
  res.screenshot=cv.toDataURL('image/png');
  return res;
};
</script></body></html>
