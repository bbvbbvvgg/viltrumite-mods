name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: mod-jars
          path: |
            viltrumiteflight/build/libs/*.jar
            viltrumitecore/build/libs/*.jar

      - name: Publish v1.25.0-ironman
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release-v1.25.0]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          Iron Man — исправления по ревью и баланс (PR #24).

          Что вошло:
          - Хоумлендер ослаблен: базовый урон 19 → 6, снижение урона 97% → 40%;
          - броня костюмов стала разной по прочности (значения брони не понижены);
          - у Железного человека всегда есть Регенерация II;
          - исправлены залипшие рамки ESP/скана после смерти, смены измерения и выхода;
          - взрывы/ракеты/Юнибим/Халкбастер не задевают союзников и игроков без PvP;
          - щит: идеальный блок больше нельзя спамить; захват Халкбастера максимум 4 с;
          - Вероника не теряется после смерти; планирование без энергии нельзя обойти пробелом;
          - мини-ракеты не бьют сквозь стены, карточка скана показывает реальную броню.

          Установка: положить оба JAR в `mods/` вместе (старые удалить). Forge 1.20.1.

          Сборка соответствует merged PR #24: 9ddfd53de8a22ccc1deda32ed8d72cf19a59ccac.
          EOF

          gh release create v1.25.0-ironman \
            viltrumitecore/build/libs/reforgedcodex-core-1.25.0.jar \
            viltrumiteflight/build/libs/reforgedcodex-flight-1.10.1.jar \
            --repo "$GITHUB_REPOSITORY" \
            --target 9ddfd53de8a22ccc1deda32ed8d72cf19a59ccac \
            --title "Iron Man — reforgedcodex-core 1.25.0 + reforgedcodex-flight 1.10.1" \
            --latest \
            --notes-file release-notes.md
