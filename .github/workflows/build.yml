name: Build

on:
  push:
    # 2.0: evidence and orchestrator branches carry no code worth a build.
    branches-ignore:
      - 'evidence/**'
      - 'ops/**'
    tags:
      - '**'
  pull_request:
  workflow_dispatch:

# 2.0: one build per branch. A newer push or the PR run cancels the stale one;
# builds of main and the integration branch are never interrupted.
concurrency:
  group: build-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ !contains(fromJSON('["main", "integration/viltrumite-2.0"]'), github.head_ref || github.ref_name) }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Test SCP-096 official audio installer (offline)
        run: python3 -m unittest discover -s tools/scp096 -p 'test_download_original_sounds.py'

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: mod-jars
          path: |
            viltrumiteflight/build/libs/*.jar
            viltrumitecore/build/libs/*.jar
