name: tmp-tensura-pack

on:
  push:
    branches:
      - tmp-tensura-pack-20261011
  workflow_dispatch:

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - name: Download exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mods
          curl -L --fail --retry 5 --retry-delay 2 -o mods/tensura-neoforge-2.0.1.3.jar 'https://edge.forgecdn.net/files/8793/360/tensura-neoforge-2.0.1.3.jar'
          curl -L --fail --retry 5 --retry-delay 2 -o mods/SmartBrainLib-neoforge-1.21.1-1.16.11.jar 'https://edge.forgecdn.net/files/7055/149/SmartBrainLib-neoforge-1.21.1-1.16.11.jar'
          curl -L --fail --retry 5 --retry-delay 2 -o mods/manascore-neoforge-4.0.0.2.jar 'https://edge.forgecdn.net/files/8022/425/manascore-neoforge-4.0.0.2.jar'
          curl -L --fail --retry 5 --retry-delay 2 -o mods/TerraBlender-neoforge-1.21.1-4.1.0.8.jar 'https://edge.forgecdn.net/files/6054/947/TerraBlender-neoforge-1.21.1-4.1.0.8.jar'
          curl -L --fail --retry 5 --retry-delay 2 -o mods/geckolib-neoforge-1.21.1-4.9.3.jar 'https://edge.forgecdn.net/files/8893/490/geckolib-neoforge-1.21.1-4.9.3.jar'
          curl -L --fail --retry 5 --retry-delay 2 -o mods/architectury-13.0.11-neoforge.jar 'https://edge.forgecdn.net/files/8492/726/architectury-13.0.11-neoforge.jar'

      - name: Verify SHA-1
        shell: bash
        run: |
          set -euo pipefail
          cd mods
          echo 'b2bb4a9cd022765b8c4542c1f049a7c57d8526b1  tensura-neoforge-2.0.1.3.jar' | sha1sum -c -
          echo '0310135a01eeceefbc7f1ab017498a65f3ad6836  SmartBrainLib-neoforge-1.21.1-1.16.11.jar' | sha1sum -c -
          echo 'f11a0062d7829e26a8705183762a5e0f2d022dd3  manascore-neoforge-4.0.0.2.jar' | sha1sum -c -
          echo '2016eed89eac0eb0510d2190c3b0b80bf4346191  TerraBlender-neoforge-1.21.1-4.1.0.8.jar' | sha1sum -c -
          echo '5cfe835472a5c5457ae9ac192d9d7b317454d5ac  geckolib-neoforge-1.21.1-4.9.3.jar' | sha1sum -c -
          echo '008656a0702801174b8ec245ed7aad1921d6e9f1  architectury-13.0.11-neoforge.jar' | sha1sum -c -

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: tensura-required-jars
          path: mods/*.jar
          compression-level: 0
          retention-days: 1
