plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle'
    id 'org.spongepowered.mixin'
}

// core uses classes from viltrumiteflight
evaluationDependsOn(':viltrumiteflight')

version = '1.50.0'
group = 'dev.baranhan.viltrumitecore'
base { archivesName = 'reforgedcodex-core' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            // load viltrumiteflight's mixins too, since both mods run together here
            args '-mixin.config=viltrumiteflight.mixins.json', '-mixin.config=viltrumiteflight.client.mixins.json'
            mods {
                viltrumitecore { source sourceSets.main }
                viltrumiteflight { source project(':viltrumiteflight').sourceSets.main }
            }
        }
        client {}
        server { args '--nogui' }
    }
}

mixin {
    add sourceSets.main, 'viltrumitecore.refmap.json'
    config 'viltrumitecore.mixins.json'
    config 'viltrumitecore.client.mixins.json'
}

repositories {
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    // GeckoLib (GeckoLibGrabRendererMixin targets GeoEntityRenderer)
    maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    // compile against flight's dev (non-reobf) classes; at runtime it is loaded as a mod via runs.mods
    compileOnly files(project(':viltrumiteflight').sourceSets.main.output)
    // optional integration: only needed to compile, not bundled
    compileOnly fg.deobf("software.bernie.geckolib:geckolib-forge-${minecraft_version}:${geckolib_version}")

    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.3'
    testImplementation sourceSets.main.output
    testImplementation files(project(':viltrumiteflight').sourceSets.main.output)
    testImplementation files(configurations.minecraft)
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed', 'skipped'
    }
}

processResources {
    inputs.property 'version', project.version
    // CC-BY audio attribution must travel with standalone JARs, not only the repo.
    from(rootProject.file('CREDITS.md')) {
        into 'META-INF/credits'
        rename { 'reinhard-credits.md' }
    }
    from(rootProject.file('tools/assets/reinhard_sources.md')) {
        into 'META-INF/credits'
        rename { 'reinhard-sources.md' }
    }
    filesMatching('META-INF/mods.toml') {
        filter { line -> line.replace('@MOD_VERSION@', project.version.toString()) }
    }
    // Lang overlays: src/main/lang-overlays/<part>/<locale>.json is merged into
    // assets/viltrumitecore/lang/<locale>.json. A locale file past ~60 KB cannot be
    // pushed in one GitHub MCP request (ru_ru.json), so new keys for it go here.
    def overlays = file('src/main/lang-overlays')
    inputs.dir(overlays).optional().withPropertyName('langOverlays')
    doLast {
        if (!overlays.isDirectory()) {
            return
        }
        def slurper = new groovy.json.JsonSlurper()
        fileTree(overlays) { include '*/*.json' }.files.sort { it.path }.each { extra ->
            def target = new File(destinationDir, "assets/viltrumitecore/lang/${extra.name}")
            if (!target.isFile()) {
                throw new GradleException("lang overlay ${extra} has no base locale file")
            }
            def merged = new LinkedHashMap(slurper.parse(target, 'UTF-8'))
            merged.putAll(slurper.parse(extra, 'UTF-8'))
            target.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(merged)), 'UTF-8')
        }
    }
}

// Binary assets (sounds, textures) are stored as base64 text under
// src/main/binassets/<resource path>.b64 and decoded into generated resources.
def binAssetsSrc = file('src/main/binassets')
def binAssetsOut = layout.buildDirectory.dir('generated/binassets')
def decodeBinaryAssets = tasks.register('decodeBinaryAssets') {
    inputs.dir(binAssetsSrc)
    outputs.dir(binAssetsOut)
    doLast {
        def out = binAssetsOut.get().asFile
        project.delete(out)
        out.mkdirs()
        binAssetsSrc.eachFileRecurse(groovy.io.FileType.FILES) { f ->
            if (f.name.endsWith('.b64')) {
                def rel = binAssetsSrc.toPath().relativize(f.toPath()).toString()
                def target = new File(out, rel.substring(0, rel.length() - 4))
                target.parentFile.mkdirs()
                target.bytes = Base64.mimeDecoder.decode(f.getText('US-ASCII').trim())
            }
        }
    }
}
sourceSets.main.resources.srcDir(decodeBinaryAssets)

jar {
    manifest {
        attributes([
            'Specification-Title'   : 'viltrumitecore',
            'Specification-Version' : '1',
            'Implementation-Title'  : 'viltrumitecore',
            'Implementation-Version': project.version,
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }